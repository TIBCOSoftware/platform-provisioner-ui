{{- range $key, $gw := .Values.gateways }}
{{- if $gw.enabled }}
---
apiVersion: gateway.networking.k8s.io/v1
kind: Gateway
metadata:
  name: {{ $gw.name | default (printf "%s-%s" (include "platform-provisioner-ui.fullname" $) $key) }}
  namespace: {{ $.Release.Namespace }}
  labels:
    {{- include "platform-provisioner-ui.labels" $ | nindent 4 }}
    {{- with $gw.labels }}
    {{- toYaml . | nindent 4 }}
    {{- end }}
  {{- with $gw.annotations }}
  annotations:
    {{- toYaml . | nindent 4 }}
  {{- end }}
{{- with $gw.spec }}
spec:
  {{- toYaml . | nindent 2 }}
{{- end }}
{{- end }}
{{- end }}

{{- range $key, $rt := .Values.httpRoutes }}
{{- if $rt.enabled }}
---
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: {{ $rt.name | default (printf "%s-%s" (include "platform-provisioner-ui.fullname" $) $key) }}
  namespace: {{ $.Release.Namespace }}
  labels:
    {{- include "platform-provisioner-ui.labels" $ | nindent 4 }}
    {{- with $rt.labels }}
    {{- toYaml . | nindent 4 }}
    {{- end }}
  {{- with $rt.annotations }}
  annotations:
    {{- toYaml . | nindent 4 }}
  {{- end }}
{{- with $rt.spec }}
spec:
  {{- toYaml . | nindent 2 }}
{{- end }}
{{- end }}
{{- end }}
