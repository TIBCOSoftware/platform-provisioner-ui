name: Release Helm Charts

# Charts are released together with an app release: pushing a v*.*.* tag
# publishes the chart whose version is in Chart.yaml at that tag.
# (Previously this ran on every push to main/releases/** — which published
# the chart *before* the PR was even reviewed. Now it only runs on a tag.)
on:
  push:
    tags:
      - 'v*.*.*'
  workflow_dispatch: {}

jobs:
  release:
    permissions:
      contents: write # to push chart release and create a release (helm/chart-releaser-action)
      packages: write # needed for ghcr access

    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Configure Git
        run: |
          git config user.name "$GITHUB_ACTOR"
          git config user.email "$GITHUB_ACTOR@users.noreply.github.com"

      - name: Install Helm
        uses: azure/setup-helm@v4
        with:
          version: '3.17.1'

      - name: Run chart-releaser
        uses: helm/chart-releaser-action@v1.7.0
        with:
          skip_existing: true
          packages_with_index: false
        env:
          CR_TOKEN: "${{ secrets.GITHUB_TOKEN }}"
