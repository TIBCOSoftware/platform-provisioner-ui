name: Build and publish image to GHCR

# Image publishing is fully automated:
#   - push to main            -> preview image  :edge  :sha-<short>   (for testing the latest synced code)
#   - push tag v*.*.*         -> release image  :X.Y.Z :X.Y :latest   (immutable, reproducible)
#   - workflow_dispatch       -> manual escape hatch with an optional extra tag
#
# Tags/labels are derived by docker/metadata-action (the open-source standard),
# so we no longer hand-maintain tag strings.

on:
  push:
    branches:
      - main
    paths:
      - 'provisioner-webui/**'
    tags:
      - 'v*.*.*'
  workflow_dispatch:
    inputs:
      extraTag:
        description: 'Optional extra image tag to push (e.g. master). Leave empty to skip.'
        required: false
        default: ''
      platform:
        description: 'Target platform(s)'
        required: false
        default: 'linux/amd64,linux/arm64'

env:
  REGISTRY: ghcr.io
  IMAGE: ghcr.io/tibcosoftware/platform-provisioner-ui/platform-provisioner-ui

# Serialize builds per ref so rapid pushes don't race on the same tags.
concurrency:
  group: docker-publish-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: build and push
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to GHCR
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Derive tags and labels
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.IMAGE }}
          tags: |
            type=raw,value=edge,enable={{is_default_branch}}
            type=sha,prefix=sha-,format=short,enable={{is_default_branch}}
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=raw,value=latest,enable=${{ startsWith(github.ref, 'refs/tags/v') }}
            type=raw,value=${{ github.event.inputs.extraTag }},enable=${{ github.event_name == 'workflow_dispatch' && github.event.inputs.extraTag != '' }}

      - name: Build metadata
        id: vars
        run: echo "build_time=$(date -u +%Y-%m-%dT%H:%M:%SZ)" >> "$GITHUB_OUTPUT"

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: ./provisioner-webui/
          file: ./provisioner-webui/dev/Dockerfile
          platforms: ${{ github.event.inputs.platform || 'linux/amd64,linux/arm64' }}
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          build-args: |
            GIT_BRANCH=${{ github.ref_name }}
            GIT_COMMIT=${{ github.sha }}
            BUILD_TIME=${{ steps.vars.outputs.build_time }}
            DOCKERFILE=Dockerfile
